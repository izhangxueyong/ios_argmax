name: "AutoTranscribe (Whisper + VAD timeline / speaker tags / SenseVoice / EmbeddingGemma search)"

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: autotranscribe-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Examples/AutoTranscribe/AutoTranscribe.xcodeproj
  SCHEME: AutoTranscribe
  BUNDLE_ID: com.argmax.autotranscribe
  DESTINATION: platform=iOS Simulator,OS=18.5,name=iPhone 16
  DERIVED_DATA: ${{ github.workspace }}/build/AutoTranscribeDerivedData
  MEDIA_DIR: ${{ github.workspace }}/build/AutoTranscribeMedia

jobs:
  autotranscribe:
    name: Build + run automatic transcription, record full run
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Prepare directories
        run: mkdir -p "$MEDIA_DIR"

      - name: Bundle ASR models into app resources
        timeout-minutes: 45
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/hf-venv"
          source "$RUNNER_TEMP/hf-venv/bin/activate"
          python -m pip install -q --upgrade huggingface_hub
          export MODELS_DIR="$GITHUB_WORKSPACE/Examples/AutoTranscribe/AutoTranscribe/Models"
          mkdir -p "$MODELS_DIR/whisper-base" "$MODELS_DIR/whisper-turbo"
          python - <<'PY'
          import os
          import pathlib
          import shutil
          from huggingface_hub import HfApi, snapshot_download

          models = os.environ["MODELS_DIR"]
          REPO = "argmaxinc/whisperkit-coreml"

          def fetch_flatten(folder, repo_subdir):
              # Lift the model files to the folder root, which is the layout
              # WhisperKitConfig(modelFolder:) expects.
              dst = pathlib.Path(models) / folder
              dst.mkdir(parents=True, exist_ok=True)
              snapshot_download(
                  repo_id=REPO,
                  local_dir=str(dst),
                  allow_patterns=[f"{repo_subdir}/*"],
              )
              src = dst / repo_subdir
              if not src.is_dir():
                  candidates = sorted({
                      f.split("/")[0] for f in HfApi().list_repo_files(REPO)
                      if "base" in f.lower() or "turbo" in f.lower()
                  })
                  raise RuntimeError(
                      f"model folder {repo_subdir!r} missing in {REPO}; "
                      f"available folders: {candidates}"
                  )
              for child in src.iterdir():
                  target = dst / child.name
                  if target.exists():
                      shutil.rmtree(target) if target.is_dir() else target.unlink()
                  shutil.move(str(child), str(target))
              src.rmdir()
              print(f"{folder}: {sorted(p.name for p in dst.iterdir())}")

          # Ordinary mode: 99-language original Whisper tokenizer (no yue).
          fetch_flatten("whisper-base", "openai_whisper-base")
          # Precise mode: 632MB large-v3-turbo, 100 languages incl. Cantonese.
          fetch_flatten("whisper-turbo", "openai_whisper-large-v3-v20240930_turbo")
          PY
          echo "Bundled model sizes:"
          du -sh "$MODELS_DIR/whisper-base" "$MODELS_DIR/whisper-turbo"
          echo "Whisper Base files:"
          ls -1 "$MODELS_DIR/whisper-base"

      - name: Bundle on-device AI models (SenseVoice / VAD / CAMPPlus / EmbeddingGemma)
        timeout-minutes: 50
        run: |
          set -e
          AI_DIR="$GITHUB_WORKSPACE/Examples/AutoTranscribe/AutoTranscribe/Models/ai-models"
          mkdir -p "$AI_DIR/sense-voice" "$AI_DIR/campplus"
          fetch() {
            local out="$1"; shift
            for url in "$@"; do
              echo "trying $url"
              if curl -fL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 900 \
                   -o "$out" "$url" && [ -s "$out" ]; then
                echo "OK $out ($(stat -f%z "$out") bytes)"
                return 0
              fi
            done
            echo "FAILED to download $out" >&2
            return 1
          }
          SV="csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main"
          SP="csukuangfj/speaker-embedding-models/resolve/main"
          EG="ggml-org/embeddinggemma-300M-GGUF/resolve/main"

          # 228 MB SenseVoiceSmall int8 (zh/en/ja/ko/yue)
          fetch "$AI_DIR/sense-voice/model.int8.onnx" \
            "https://huggingface.co/$SV/model.int8.onnx" \
            "https://hf-mirror.com/$SV/model.int8.onnx"
          fetch "$AI_DIR/sense-voice/tokens.txt" \
            "https://huggingface.co/$SV/tokens.txt" \
            "https://hf-mirror.com/$SV/tokens.txt"

          # 208 KB Silero VAD int8
          fetch "$AI_DIR/silero_vad.int8.onnx" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.int8.onnx" \
            "https://ghproxy.net/https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.int8.onnx" \
            "https://hf-mirror.com/csukuangfj/vad/resolve/main/silero_vad.onnx"

          # 28 MB CAMPPlus speaker embedding (advanced zh/en 16k)
          fetch "$AI_DIR/campplus/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx" \
            "https://huggingface.co/$SP/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx" \
            "https://hf-mirror.com/$SP/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"

          # 334 MB EmbeddingGemma 300M Q8_0 GGUF
          fetch "$AI_DIR/embeddinggemma-300M-Q8_0.gguf" \
            "https://huggingface.co/$EG/embeddinggemma-300M-Q8_0.gguf" \
            "https://hf-mirror.com/$EG/embeddinggemma-300M-Q8_0.gguf"

          echo "=== AI model sizes ==="
          du -sh "$AI_DIR" "$AI_DIR"/* "$AI_DIR"/sense-voice/* "$AI_DIR"/campplus/* 2>/dev/null || true
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "Examples/AutoTranscribe/AutoTranscribe/Models/ai-models"
          expected = {
              "sense-voice/model.int8.onnx": 200_000_000,
              "sense-voice/tokens.txt": 100_000,
              "silero_vad.int8.onnx": 100_000,
              "campplus/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx": 20_000_000,
              "embeddinggemma-300M-Q8_0.gguf": 300_000_000,
          }
          for name, minimum in expected.items():
              p = root / name
              size = p.stat().st_size if p.exists() else 0
              print(f"{name}: {size} bytes")
              if size < minimum:
                  raise SystemExit(f"model too small: {name}")
          with open(root / "embeddinggemma-300M-Q8_0.gguf", "rb") as f:
              assert f.read(4) == b"GGUF", "bad GGUF magic"
          print("all AI models present and GGUF magic verified")
          PY

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devices in d["devices"].items():
              if "iOS-18-5" not in runtime:
                  continue
              for dev in devices:
                  if dev["name"] == "iPhone 16" and dev.get("isAvailable"):
                      print(dev["udid"]); break
          ' | head -1)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build AutoTranscribe app
        run: |
          set -euo pipefail
          ART="$DERIVED_DATA/SourcePackages/artifacts/sherpa-onnx-spm"
          ORT="$ART/onnxruntime/onnxruntime.xcframework"

          # The upstream willwade/sherpa-onnx-spm package ships TWO
          # XCFrameworks (sherpa-onnx + onnxruntime) and BOTH contain
          # Headers/module.modulemap. Xcode's ProcessXCFramework copies them
          # into the same Build/Products/.../include/module.modulemap and fails
          # with "Multiple commands produce".
          #
          # Stage 1 lets xcodebuild resolve the package graph and unpack the
          # binary artifacts. That first pass is expected to stop right at the
          # collision, so its exit status is intentionally ignored.
          if [ ! -d "$ORT" ]; then
            echo "=== Stage 1: resolve packages / unpack XCFrameworks ==="
            xcodebuild build \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              | xcbeautify --renderer github-actions \
              || echo "Stage 1 ended at the known modulemap collision (expected)."
          fi

          if [ ! -d "$ORT" ]; then
            echo "ERROR: onnxruntime XCFramework was not materialised"
            find "$DERIVED_DATA/SourcePackages" -maxdepth 5 -type d 2>/dev/null | head -60
            exit 1
          fi

          # Our Swift code only imports the `sherpa_onnx` C module through the
          # upstream SherpaOnnx product; nothing imports `onnxruntime`.
          # Deleting that unused module map leaves libonnxruntime.a linked but
          # removes the duplicate include/module.modulemap output.
          echo "=== Stage 2: drop duplicate onnxruntime module map ==="
          find "$ORT" -name module.modulemap -print -delete
          echo "remaining module maps:"
          find "$ART" -name module.modulemap -print
          test "$(find "$ART" -name module.modulemap | wc -l | tr -d ' ')" -eq 3

          # Stage 3 is the real build. Disable automatic package resolution so
          # xcodebuild does not re-unpack the frameworks and undo the patch.
          echo "=== Stage 3: build app ==="
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Install app on simulator
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AutoTranscribe.app"
          echo "App: $APP_PATH"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "Installed $BUNDLE_ID"

      - name: Run app and record full pipeline (launch -> result)
        timeout-minutes: 150
        run: |
          set -e
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          echo "App data container: $CONTAINER"
          DOCS="$CONTAINER/Documents"
          rm -f "$DOCS/transcription_done.txt" "$DOCS/demo_done.txt" "$DOCS/progress.log" \
                "$DOCS/recordings.json" "$DOCS/sessions.json" "$DOCS/archive_action.log" \
                "$DOCS/archive_scroll_started.txt" "$DOCS/archive_scroll_step.txt" \
                "$DOCS/archive_scroll_done.txt" "$DOCS/archive_list_full.png" \
                "$DOCS/retranscribe_action.log" "$DOCS/model_config.json" \
                "$DOCS/model_calls.json" "$DOCS/model_management_export.json" 2>/dev/null || true

          # Start recording BEFORE launch so the launch animation is captured.
          echo "Starting screen recording..."
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$MEDIA_DIR/AutoTranscribe-session-archive-full-run.mp4" &
          RECORD_PID=$!
          sleep 2

          # Background watcher: capture one still for EVERY screen of the
          # archived-list scroll, so the full list is visible as stills even if
          # the simulator video freezes during long inference.
          (
            seen=""
            idle_after_done=0
            while true; do
              if [ -f "$DOCS/archive_scroll_step.txt" ]; then
                step=$(tr -d '\n' < "$DOCS/archive_scroll_step.txt" 2>/dev/null || true)
                if [ -n "$step" ] && [ "$step" != "$seen" ]; then
                  # Let the scroll/sheet animation settle before grabbing the still.
                  sleep 2
                  label=$(printf "%02d" "$step" 2>/dev/null || echo "$step")
                  xcrun simctl io "$UDID" screenshot "$MEDIA_DIR/AutoTranscribe-frame-$label.png" || true
                  seen="$step"
                fi
              fi
              if [ -f "$DOCS/demo_done.txt" ]; then
                idle_after_done=$((idle_after_done + 1))
                if [ "$idle_after_done" -ge 3 ]; then break; fi
              fi
              sleep 2
            done
          ) &
          WATCH_PID=$!

          xcrun simctl launch "$UDID" "$BUNDLE_ID" --args --auto-run

          # Poll for the demo completion sentinel: multi-clip sessions, two
          # checkmark archives, full list scroll, result replay, return home.
          echo "Waiting for session archive demo to finish..."
          DONE=0
          for i in $(seq 1 500); do
            if [ -f "$DOCS/demo_done.txt" ]; then
              echo "Demo sentinel found at check $i"
              DONE=1
              break
            fi
            # Stream progress log into the workflow log for visibility.
            if [ -f "$DOCS/progress.log" ]; then
              tail -n 2 "$DOCS/progress.log" | sed 's/^/  [app] /' || true
            fi
            if [ $((i % 20)) -eq 0 ]; then
              echo "  [ci] still waiting for session archive demo ($i/500 checks, ~$((i / 4))min)"
            fi
            sleep 15
          done

          if [ "$DONE" -ne 1 ]; then
            echo "WARNING: demo completion sentinel not found within 125 min"
          fi

          # Stop the background still watcher once the demo is over.
          wait "$WATCH_PID" 2>/dev/null || true

          # Let the final result settle and stay on screen. The simulator screen
          # can lag behind the app state after a long local inference run, so
          # give it enough time to repaint before stopping the recording.
          sleep 8

          # Capture a still of the result screen. simctl's virtual display can
          # freeze the recorded video on an earlier frame during long background
          # work; a fresh screenshot forces a repaint and is a reliable artifact.
          echo "Capturing result screenshot..."
          mkdir -p "$MEDIA_DIR"
          xcrun simctl io "$UDID" screenshot "$MEDIA_DIR/AutoTranscribe-session-archive-result.png" || true
          ls -lh "$MEDIA_DIR/AutoTranscribe-session-archive-result.png" 2>/dev/null || true

          # Copy the app-rendered full-height archived list (one tall image that
          # shows every archived session, clip name, file name and waveform).
          if [ -f "$DOCS/archive_list_full.png" ]; then
            cp "$DOCS/archive_list_full.png" "$MEDIA_DIR/AutoTranscribe-archive-list-FULL.png"
            echo "Full archived list image exported:"
            ls -lh "$MEDIA_DIR/AutoTranscribe-archive-list-FULL.png"
          else
            echo "WARNING: full archived list image missing"
          fi
          sleep 12

          echo "Stopping screen recording (PID $RECORD_PID)..."
          kill -SIGINT "$RECORD_PID"
          wait "$RECORD_PID" || true

          echo "=== demo_done.txt ==="
          cat "$DOCS/demo_done.txt" 2>/dev/null || echo "(missing)"
          echo "=== archived sessions ==="
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("sessions:", len(d)); [print(" -", s.get("title", "session#" + str(s.get("index"))), "archived=", s.get("isArchived"), "clips=", len(s.get("itemIDs", []))) for s in d]' "$DOCS/sessions.json" 2>/dev/null || echo "(sessions.json missing)"
          echo "=== checkmark archive actions ==="
          cat "$DOCS/archive_action.log" 2>/dev/null || echo "(missing)"
          echo "=== saved recordings (model / elapsed / language direction) ==="
          python3 - "$DOCS/recordings.json" <<'PY' || echo "(recordings.json missing)"
          import json, sys
          data = json.load(open(sys.argv[1]))
          print("recordings:", len(data))
          for x in data:
              m = x.get("transcription") or {}
              print(" -", x.get("source"), x.get("name"), x.get("fileName"),
                    "| model=", m.get("modelName"),
                    "| elapsed=", m.get("elapsed"),
                    "| direction=", m.get("sourceLanguage"), "->", m.get("targetLanguage"),
                    "| task=", m.get("taskTitle"),
                    "| retranscribed=", m.get("retranscribeCount"),
                    "| transcript=", bool(x.get("transcript")))
          PY
          echo "=== retranscribe actions ==="
          cat "$DOCS/retranscribe_action.log" 2>/dev/null || echo "(missing)"
          echo "=== AI analysis summary (VAD / CAMPPlus / SenseVoice / EmbeddingGemma) ==="
          python3 - "$DOCS/recordings.json" <<'PY' || echo "(recordings.json missing)"
          import json, sys
          data = json.load(open(sys.argv[1]))
          print("items:", len(data))
          for x in data:
              timeline = x.get("voiceTimeline") or {}
              segments = timeline.get("segments") or []
              print(" -", x.get("fileName"),
                    "| vad_segments=", len(segments),
                    "| me=", sum(1 for s in segments if s.get("isMe")),
                    "| sensevoice=", bool(x.get("senseVoiceText")),
                    "| lang=", x.get("senseVoiceLanguage"),
                    "| vector_dim=", len(x.get("searchVector") or []))
          PY
          echo "=== AI model + semantic search lines ==="
          grep -E "AI model:|AI encoder:|SenseVoice probe|Search index|Semantic search|hit score" "$DOCS/progress.log" || true

          echo "=== '模式和模型' management screen lines ==="
          grep -E "MODEL MGMT|DEMO model management|tuning applied|call logged|load calls logged|deviations" "$DOCS/progress.log" || true

          echo "=== model config (model_config.json) ==="
          cat "$DOCS/model_config.json" 2>/dev/null || echo "(missing)"

          echo "=== model call log summary (model_calls.json) ==="
          python3 - "$DOCS/model_calls.json" <<'PY' || echo "(model_calls.json missing)"
          import json, sys, collections
          calls = json.load(open(sys.argv[1]))
          print("total calls:", len(calls))
          by_model = collections.Counter(c.get("modelID") for c in calls)
          by_op = collections.Counter(c.get("operation") for c in calls)
          by_status = collections.Counter(c.get("status") for c in calls)
          print("by model:", dict(by_model))
          print("by operation:", dict(by_op))
          print("by status:", dict(by_status))
          print("avg elapsed(s):", round(sum(c.get("elapsed", 0) for c in calls) / max(1, len(calls)), 3))
          for c in calls[:4] + calls[-4:]:
              print(" -", c.get("modelID"), "|", c.get("operation"),
                    "|", c.get("modeRaw"), "|", c.get("status"),
                    "| elapsed=", round(c.get("elapsed", 0), 3),
                    "| params=", len(c.get("parameters") or {}),
                    "|", (c.get("result") or "")[:90])
          PY

          echo "=== exported config + call log artifact ==="
          if [ -f "$DOCS/model_management_export.json" ]; then
            cp "$DOCS/model_management_export.json" "$MEDIA_DIR/AutoTranscribe-model-management-export.json"
            cp "$DOCS/model_config.json" "$MEDIA_DIR/AutoTranscribe-model-config.json" 2>/dev/null || true
            cp "$DOCS/model_calls.json" "$MEDIA_DIR/AutoTranscribe-model-calls.json" 2>/dev/null || true
            ls -lh "$MEDIA_DIR/"*.json
          else
            echo "WARNING: model_management_export.json missing"
          fi

          echo "=== progress.log ==="
          cat "$DOCS/progress.log" 2>/dev/null || echo "(missing)"

          ls -lh "$MEDIA_DIR/"

      - name: Upload full-run video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotranscribe-session-archive-full-run
          path: |
            ${{ env.MEDIA_DIR }}/*.mp4
            ${{ env.MEDIA_DIR }}/*.png
            ${{ env.MEDIA_DIR }}/*.json
          if-no-files-found: warn
          retention-days: 7
