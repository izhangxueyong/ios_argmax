name: "AutoTranscribe (session archive + full archived list, full run recording)"

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: autotranscribe-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Examples/AutoTranscribe/AutoTranscribe.xcodeproj
  SCHEME: AutoTranscribe
  BUNDLE_ID: com.argmax.autotranscribe
  DESTINATION: platform=iOS Simulator,OS=18.5,name=iPhone 16
  DERIVED_DATA: ${{ github.workspace }}/build/AutoTranscribeDerivedData
  MEDIA_DIR: ${{ github.workspace }}/build/AutoTranscribeMedia

jobs:
  autotranscribe:
    name: Build + run automatic transcription, record full run
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Prepare directories
        run: mkdir -p "$MEDIA_DIR"

      - name: Bundle ASR models into app resources
        timeout-minutes: 45
        run: |
          set -e
          python3 -m venv "$RUNNER_TEMP/hf-venv"
          source "$RUNNER_TEMP/hf-venv/bin/activate"
          python -m pip install -q --upgrade huggingface_hub
          export MODELS_DIR="$GITHUB_WORKSPACE/Examples/AutoTranscribe/AutoTranscribe/Models"
          mkdir -p "$MODELS_DIR/sensevoice-small" "$MODELS_DIR/whisper-turbo"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          models = os.environ["MODELS_DIR"]

          # Ordinary mode: SenseVoiceSmall fp32 encoder works on both
          # CPU-only simulators and Neural Engine devices.
          snapshot_download(
              repo_id="FluidInference/sensevoice-small-coreml",
              local_dir=f"{models}/sensevoice-small",
              allow_patterns=[
                  "SenseVoicePreprocessor.mlmodelc/*",
                  "SenseVoiceSmall_fp32.mlmodelc/*",
                  "vocab.json",
              ],
          )

          # Precise mode: 632MB Large v3 Turbo, copied to the folder root
          # that WhisperKitConfig(modelFolder:) expects.
          turbo_dir = f"{models}/whisper-turbo/openai_whisper-large-v3-v20240930_turbo"
          snapshot_download(
              repo_id="argmaxinc/whisperkit-coreml",
              local_dir=f"{models}/whisper-turbo",
              allow_patterns=["openai_whisper-large-v3-v20240930_turbo/*"],
          )
          import pathlib, shutil
          src = pathlib.Path(turbo_dir)
          dst = pathlib.Path(f"{models}/whisper-turbo")
          for child in src.iterdir():
              target = dst / child.name
              if target.exists():
                  shutil.rmtree(target) if target.is_dir() else target.unlink()
              shutil.move(str(child), str(target))
          src.rmdir()
          PY
          echo "Bundled model sizes:"
          du -sh "$MODELS_DIR/sensevoice-small" "$MODELS_DIR/whisper-turbo"

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devices in d["devices"].items():
              if "iOS-18-5" not in runtime:
                  continue
              for dev in devices:
                  if dev["name"] == "iPhone 16" and dev.get("isAvailable"):
                      print(dev["udid"]); break
          ' | head -1)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build AutoTranscribe app
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Install app on simulator
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AutoTranscribe.app"
          echo "App: $APP_PATH"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "Installed $BUNDLE_ID"

      - name: Run app and record full pipeline (launch -> result)
        timeout-minutes: 150
        run: |
          set -e
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          echo "App data container: $CONTAINER"
          DOCS="$CONTAINER/Documents"
          rm -f "$DOCS/transcription_done.txt" "$DOCS/demo_done.txt" "$DOCS/progress.log" \
                "$DOCS/recordings.json" "$DOCS/sessions.json" "$DOCS/archive_action.log" \
                "$DOCS/archive_scroll_started.txt" "$DOCS/archive_scroll_step.txt" \
                "$DOCS/archive_scroll_done.txt" "$DOCS/archive_list_full.png" 2>/dev/null || true

          # Start recording BEFORE launch so the launch animation is captured.
          echo "Starting screen recording..."
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$MEDIA_DIR/AutoTranscribe-session-archive-full-run.mp4" &
          RECORD_PID=$!
          sleep 2

          # Background watcher: capture one still for EVERY screen of the
          # archived-list scroll, so the full list is visible as stills even if
          # the simulator video freezes during long inference.
          (
            seen=""
            idle_after_done=0
            while true; do
              if [ -f "$DOCS/archive_scroll_step.txt" ]; then
                step=$(tr -d '\n' < "$DOCS/archive_scroll_step.txt" 2>/dev/null || true)
                if [ -n "$step" ] && [ "$step" != "$seen" ]; then
                  # Let the scroll/sheet animation settle before grabbing the still.
                  sleep 2
                  label=$(printf "%02d" "$step" 2>/dev/null || echo "$step")
                  xcrun simctl io "$UDID" screenshot "$MEDIA_DIR/AutoTranscribe-frame-$label.png" || true
                  seen="$step"
                fi
              fi
              if [ -f "$DOCS/demo_done.txt" ]; then
                idle_after_done=$((idle_after_done + 1))
                if [ "$idle_after_done" -ge 3 ]; then break; fi
              fi
              sleep 2
            done
          ) &
          WATCH_PID=$!

          xcrun simctl launch "$UDID" "$BUNDLE_ID" --args --auto-run

          # Poll for the demo completion sentinel: multi-clip sessions, two
          # checkmark archives, full list scroll, result replay, return home.
          echo "Waiting for session archive demo to finish..."
          DONE=0
          for i in $(seq 1 500); do
            if [ -f "$DOCS/demo_done.txt" ]; then
              echo "Demo sentinel found at check $i"
              DONE=1
              break
            fi
            # Stream progress log into the workflow log for visibility.
            if [ -f "$DOCS/progress.log" ]; then
              tail -n 2 "$DOCS/progress.log" | sed 's/^/  [app] /' || true
            fi
            if [ $((i % 20)) -eq 0 ]; then
              echo "  [ci] still waiting for session archive demo ($i/500 checks, ~$((i / 4))min)"
            fi
            sleep 15
          done

          if [ "$DONE" -ne 1 ]; then
            echo "WARNING: demo completion sentinel not found within 125 min"
          fi

          # Stop the background still watcher once the demo is over.
          wait "$WATCH_PID" 2>/dev/null || true

          # Let the final result settle and stay on screen. The simulator screen
          # can lag behind the app state after a long local inference run, so
          # give it enough time to repaint before stopping the recording.
          sleep 8

          # Capture a still of the result screen. simctl's virtual display can
          # freeze the recorded video on an earlier frame during long background
          # work; a fresh screenshot forces a repaint and is a reliable artifact.
          echo "Capturing result screenshot..."
          mkdir -p "$MEDIA_DIR"
          xcrun simctl io "$UDID" screenshot "$MEDIA_DIR/AutoTranscribe-session-archive-result.png" || true
          ls -lh "$MEDIA_DIR/AutoTranscribe-session-archive-result.png" 2>/dev/null || true

          # Copy the app-rendered full-height archived list (one tall image that
          # shows every archived session, clip name, file name and waveform).
          if [ -f "$DOCS/archive_list_full.png" ]; then
            cp "$DOCS/archive_list_full.png" "$MEDIA_DIR/AutoTranscribe-archive-list-FULL.png"
            echo "Full archived list image exported:"
            ls -lh "$MEDIA_DIR/AutoTranscribe-archive-list-FULL.png"
          else
            echo "WARNING: full archived list image missing"
          fi
          sleep 12

          echo "Stopping screen recording (PID $RECORD_PID)..."
          kill -SIGINT "$RECORD_PID"
          wait "$RECORD_PID" || true

          echo "=== demo_done.txt ==="
          cat "$DOCS/demo_done.txt" 2>/dev/null || echo "(missing)"
          echo "=== archived sessions ==="
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("sessions:", len(d)); [print(" -", s.get("title", "session#" + str(s.get("index"))), "archived=", s.get("isArchived"), "clips=", len(s.get("itemIDs", []))) for s in d]' "$DOCS/sessions.json" 2>/dev/null || echo "(sessions.json missing)"
          echo "=== checkmark archive actions ==="
          cat "$DOCS/archive_action.log" 2>/dev/null || echo "(missing)"
          echo "=== saved recordings ==="
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("recordings:", len(d)); [print(" -", x.get("source"), x.get("name"), x.get("fileName"), "transcript=" + str(bool(x.get("transcript")))) for x in d]' "$DOCS/recordings.json" 2>/dev/null || echo "(recordings.json missing)"
          echo "=== progress.log ==="
          cat "$DOCS/progress.log" 2>/dev/null || echo "(missing)"

          ls -lh "$MEDIA_DIR/"

      - name: Upload full-run video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotranscribe-session-archive-full-run
          path: |
            ${{ env.MEDIA_DIR }}/*.mp4
            ${{ env.MEDIA_DIR }}/*.png
          if-no-files-found: warn
          retention-days: 7
