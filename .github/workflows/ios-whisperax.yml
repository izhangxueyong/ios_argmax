name: iOS WhisperAX (Simulator)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-whisperax-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Examples/WhisperAX/WhisperAX.xcodeproj
  SCHEME: WhisperAX
  DESTINATION: platform=iOS Simulator,OS=18.5,name=iPhone 16
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  RESULTS_DIR: ${{ github.workspace }}/build/TestResults

jobs:
  build-and-test:
    name: Build + Unit + UI Tests on iOS 18.5
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain and simulator
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep "iPhone 16" | head -5

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Prepare output directories
        run: mkdir -p "$RESULTS_DIR"

      - name: Build app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:WhisperAXTests \
            -resultBundlePath "$RESULTS_DIR/UnitTests.xcresult" \
            -collect-test-diagnostics never \
            | xcbeautify --renderer github-actions

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:WhisperAXUITests \
            -resultBundlePath "$RESULTS_DIR/UITests.xcresult" \
            -collect-test-diagnostics never \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisperax-ios-test-results
          path: build/TestResults/*.xcresult
          if-no-files-found: warn
          retention-days: 7
