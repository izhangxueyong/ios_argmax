name: iOS WhisperAX (Simulator)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-whisperax-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Examples/WhisperAX/WhisperAX.xcodeproj
  APP_SCHEME: WhisperAX
  PKG_SCHEME: argmax-oss-swift-Package
  TEST_PLAN: UnitTestsPlan
  DESTINATION: platform=iOS Simulator,OS=18.5,name=iPhone 16
  DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
  RESULTS_DIR: ${{ github.workspace }}/build/TestResults

jobs:
  build-and-test:
    name: Build + Unit + UI Tests on iOS 18.5
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain and simulator
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep "iPhone 16" | head -5

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Prepare output directories
        run: mkdir -p "$RESULTS_DIR"

      - name: Boot iOS Simulator
        run: |
          udid=$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devices in d["devices"].items():
              if "iOS-18-5" not in runtime:
                  continue
              for dev in devices:
                  if dev["name"] == "iPhone 16" and dev.get("isAvailable"):
                      print(dev["udid"])
                      break
          ' | head -1)
          echo "Simulator UDID: $udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build WhisperAX app and test bundles
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Unit tests (package scheme + UnitTestsPlan)
        timeout-minutes: 40
        run: |
          set -o pipefail
          xcodebuild test \
            -testPlan "$TEST_PLAN" \
            -scheme "$PKG_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULTS_DIR/UnitTests.xcresult" \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: UI tests (WhisperAXUITests)
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:WhisperAXUITests \
            -resultBundlePath "$RESULTS_DIR/UITests.xcresult" \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Launch app, record demo video and capture screenshot
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set -e
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/WhisperAX.app"
          echo "App path: $APP_PATH"
          ls -d "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"

          # xcodebuild test shuts the simulator down, so re-boot it explicitly
          UDID=$(xcrun simctl list devices -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for runtime, devices in d["devices"].items():
              if "iOS-18-5" not in runtime:
                  continue
              for dev in devices:
                  if dev["name"] == "iPhone 16" and dev.get("isAvailable"):
                      print(dev["udid"])
                      break
          ' | head -1)
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl install "$UDID" "$APP_PATH"

          mkdir -p build/Screenshots

          # Record the launch animation + home screen.
          # SIGINT is required so simctl finalizes a playable MP4.
          echo "Starting screen recording..."
          xcrun simctl io "$UDID" recordVideo --codec=h264 build/Screenshots/WhisperAX-demo.mp4 &
          RECORD_PID=$!
          sleep 2

          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 16

          xcrun simctl io "$UDID" screenshot build/Screenshots/WhisperAX-home.png

          echo "Stopping screen recording (PID $RECORD_PID)..."
          kill -SIGINT "$RECORD_PID"
          wait "$RECORD_PID" || true

          ls -lh build/Screenshots/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisperax-ios-test-results
          path: build/TestResults/*.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Upload app screenshot and demo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisperax-ios-demo
          path: |
            build/Screenshots/*.png
            build/Screenshots/*.mp4
          if-no-files-found: warn
          retention-days: 7
